// This file defines the protobuf message that will be used to configure
// the StatsPublisher service for IVI telemetry.

syntax = "proto3";

package google.sdv.telemetry.java.statspublisher;

option java_package = "google.sdv.telemetry.java.statspublisher";
option java_outer_classname = "StatsPublisherReportProto";

// TODO: investigate if actual Atom message proto can be sent as a subfield of the AtomReport
// message. b/435444175.

// Details the configuration for collection and filtering of an atom.
message AtomReport {
   // Serialized Atom data for the stats report
   bytes data = 2;

   // Timestamp for the report
   int64 elapsed_timestamp_nanos = 3;
}

// Report List Message, contains a list of reports for atoms on a per-atom-basis.
message AtomReportList {
   repeated AtomReport report = 1;
}

// Contains a serialized byte array of the AtomReportList Message
message AtomReportWrapper {
   bytes data = 1;
}
