// Partial clone of frameworks/proto_logging/stats/atoms.proto. StatsPublisher
// only uses a subset of atoms. Unused messages are not copied here.

syntax = "proto2";

package google.sdv.telemetry.java.statspublisher;
option java_package = "google.sdv.telemetry.java.statspublisher";
option java_outer_classname = "AtomsProto";



message Atom {
  oneof pushed {
    ActivityForegroundStateChanged activity_foreground_state_changed = 42;
    AppStartOccurred app_start_occurred = 48;
    AppCrashOccurred app_crash_occurred = 78;
    MediaPlaybackStateChanged media_playback_state_changed = 322;
  }
}

// Notifies when an Activity enters or exits the foreground state.
// Can be multiple activities at once.
message ActivityForegroundStateChanged {
  optional int32 uid = 1;
  optional string pkg_name = 2;
  optional string class_name = 3;
  enum State {
    BACKGROUND = 0;
    FOREGROUND = 1;
  }
  optional State state = 4;
}

// Copied from //frameworks/proto_logging/stats/enums/server/enums.proto
enum ErrorSource {
  ERROR_SOURCE_UNKNOWN = 0;
  DATA_APP = 1;
  SYSTEM_APP = 2;
  SYSTEM_SERVER = 3;
}

// Notifies when an app crash occurs.
message AppCrashOccurred {
  optional int32 uid = 1;
  optional string event_type = 2;
  optional string process_name = 3;
  optional int32 pid = 4;
  optional string package_name = 5;
  enum InstantApp {
    UNAVAILABLE = 0;
    FALSE = 1;
    TRUE = 2;
  }
  optional InstantApp is_instant_app = 6;
  enum ForegroundState {
    UNKNOWN = 0;
    BACKGROUND = 1;
    FOREGROUND = 2;
  }
  optional ForegroundState foreground_state = 7;
  optional ErrorSource error_source = 8;
  optional bool is_incremental = 9;
  optional float loading_progress = 10;
  optional int64 millis_since_oldest_pending_read = 11;
  optional int32 storage_health_code = 12;
  optional int32 data_loader_status_code = 13;
  optional bool read_logs_enabled = 14;
  optional int64 millis_since_last_data_loader_bind = 15;
  optional int64 data_loader_bind_delay_millis = 16;
  optional int32 total_delayed_reads = 17;
  optional int32 total_failed_reads = 18;
  optional int32 last_read_error_uid = 19;
  optional int64 last_read_error_millis_since = 20;
  optional int32 last_read_error_code = 21;
  optional int64 total_delayed_reads_duration_millis = 22;
}

/**
 * The stopped state of a package.
 */
enum PackageStoppedState {
  PACKAGE_STATE_UNKNOWN = 0;
  PACKAGE_STATE_NORMAL = 1;   // The package is not in any stopped state
  PACKAGE_STATE_STOPPED = 2;  // ApplicationInfo.FLAG_STOPPED
}

// ActivityManagerInternal.java's APP_TRANSITION reasons.
enum AppTransitionReasonEnum {
  APP_TRANSITION_REASON_UNKNOWN = 0;
  // The transition was started because we drew the splash screen.
  APP_TRANSITION_SPLASH_SCREEN = 1;
  // The transition was started because we all app windows were drawn.
  APP_TRANSITION_WINDOWS_DRAWN = 2;
  // The transition was started because of a timeout.
  APP_TRANSITION_TIMEOUT = 3;
  // The transition was started because of a we drew a task snapshot.
  APP_TRANSITION_SNAPSHOT = 4;
  // The transition was started because it was a recents animation
  // and we only needed to wait on the wallpaper.
  APP_TRANSITION_RECENTS_ANIM = 5;
}

// Metrics related to time to start an application.
message AppStartOccurred {
  // The uid if available. -1 means not available.
  optional int32 uid = 1;

  // The app package name.
  optional string pkg_name = 2;

  enum TransitionType {
    UNKNOWN = 0;
    WARM = 1;
    HOT = 2;
    COLD = 3;
    RELAUNCH = 4;
  }
  // The transition type.
  optional TransitionType type = 3;

  // The activity name.
  optional string activity_name = 4;

  // The name of the calling app. Empty if not set.
  optional string calling_pkg_name = 5;

  // Whether the app is an instant app.
  optional bool is_instant_app = 6;

  // Device uptime when activity started.
  optional int64 activity_start_millis = 7;

  optional AppTransitionReasonEnum reason = 8;

  // The time to start the application.
  optional int32 transition_delay_millis = 9;

  // The time from starting the application until the start window is
  // considered drawn. -1 if not set.
  optional int32 starting_window_delay_millis = 10;

  // The time from starting the application until the application is bound. -1
  // if not set.
  optional int32 bind_application_delay_millis = 11;

  // The time from starting the application until all windows have been drawn.
  optional int32 windows_drawn_delay_millis = 12;

  // A generated token on the device that can be used to track an instance of
  // launching an instant app. Empty if not set.
  optional string launch_token = 13;

  // The reason why the package was optimized.
  optional int32 package_optimization_compilation_reason = 14;

  // The compiler filter used when when the package was optimized.
  // The full list of options is in compiler-filter flag for dex2oat.cc.
  optional int32 package_optimization_compilation_filter = 15;

  enum SourceType {
    UNAVAILABLE = 0;
    LAUNCHER = 1;
    NOTIFICATION = 2;
    LOCKSCREEN = 3;
    RECENTS_ANIMATION = 4;
    DESKTOP_ANIMATION = 5;
    QSS = 6;
    TILE = 7;
    COMPLICATION = 8;
  }
  // The type of the startup source.
  optional SourceType source_type = 16;

  // The time from the startup source to the beginning of handling the startup
  // event. -1 means not available.
  optional int32 source_event_delay_millis = 17;

  // Whether the app is hibernating when it started
  optional bool is_hibernating = 18;

  // Whether the app is installed on Incremental File System.
  optional bool is_incremental = 19;

  // Whether the app is still being streamed.
  optional bool is_loading = 20;

  // The hash value of the activity name.
  optional int32 activity_name_hash = 21;

  // The timestamp(SystemClock#elapsedRealtime()) when starting activity.
  optional int64 activity_start_timestamp_millis = 22;

  /**
   * The process state of apps, keep in sync with
   * frameworks/base/core/java/android/app/ActivityManager.java
   */
  enum AppProcessState {
    PROCESS_STATE_UNKNOWN = -1;
    PROCESS_STATE_PERSISTENT = 0;
    PROCESS_STATE_PERSISTENT_UI = 1;
    PROCESS_STATE_TOP = 2;
    PROCESS_STATE_BOUND_TOP = 3;
    PROCESS_STATE_FOREGROUND_SERVICE = 4;
    PROCESS_STATE_BOUND_FOREGROUND_SERVICE = 5;
    PROCESS_STATE_IMPORTANT_FOREGROUND = 6;
    PROCESS_STATE_IMPORTANT_BACKGROUND = 7;
    PROCESS_STATE_TRANSIENT_BACKGROUND = 8;
    PROCESS_STATE_BACKUP = 9;
    PROCESS_STATE_SERVICE = 10;
    PROCESS_STATE_RECEIVER = 11;
    PROCESS_STATE_TOP_SLEEPING = 12;
    PROCESS_STATE_HEAVY_WEIGHT = 13;
    PROCESS_STATE_HOME = 14;
    PROCESS_STATE_LAST_ACTIVITY = 15;
    PROCESS_STATE_CACHED_ACTIVITY = 16;
    PROCESS_STATE_CACHED_ACTIVITY_CLIENT = 17;
    PROCESS_STATE_CACHED_RECENT = 18;
    PROCESS_STATE_CACHED_EMPTY = 19;
    PROCESS_STATE_NONEXISTENT = 20;
  }
  // The process state of the launching activity prior to the launch.
  optional AppProcessState process_state = 23;

  // The oom adj score of the launching activity prior to the launch.
  optional int32 process_oom_adj = 24;

  // The stopped state (if any) the package was in before the launch
  optional PackageStoppedState package_stopped_state = 25;

  // Whether the activity is an immersive XR activity.
  optional bool is_xr_activity = 26;
}


enum PlaybackState {
    // Playback has not started (initial state)
    NOT_STARTED = 0;
    // Playback is buffering in the background for initial playback start
    JOINING_BACKGROUND = 1;
    // Playback is buffering in the foreground for initial playback start
    JOINING_FOREGROUND = 2;
    // Playback is actively playing
    PLAYING = 3;
    // Playback is paused but ready to play
    PAUSED = 4;
    // Playback is handling a seek
    SEEKING = 5;
    // Playback is buffering to resume active playback
    BUFFERING = 6;
    // Playback is buffering while paused
    PAUSED_BUFFERING = 7;
    // the value 8 is not used
    reserved 8;
    // Playback is suppressed (e.g. due to audio focus loss)
    SUPPRESSED = 9;
    // Playback is suppressed (e.g. due to audio focus loss) while buffering to resume a
    // playback
    SUPPRESSED_BUFFERING = 10;
    // Playback has reached the end of the media
    ENDED = 11;
    // Playback is stopped and can be restarted
    STOPPED = 12;
    // Playback is stopped due a fatal error and can be retried
    FAILED = 13;
    // Playback is interrupted by an ad
    INTERRUPTED_BY_AD = 14;
    // Playback is abandoned before reaching the end of the media
    ABANDONED = 15;
}

// Tells when the media playing in the car changed either state
message MediaPlaybackStateChanged {
    // Randomly generated log session ID. A Base64 encoded hex string representing a
    // 128-bit integer.
    optional string log_session_id = 1;
    //  New playback state
    optional PlaybackState playback_state = 2;
    // When the state change occurred relative to playback creation time in
    // milliseconds.
    // It is in absolute time (e.g. always ticks even if the playback is paused).
    optional int64 time_since_playback_created_millis = 3;
}