syntax = "proto3";

package com.google.sdv.telemetry.samples;

message ErrorReportData {
  uint64 timestamp = 1;
  ErrorInfo error_info = 2;
}

enum Severity {
  UNSPECIFIED = 0;
  FATAL = 1;
  ERROR = 2;
  WARN = 3;
  INFO = 4;
  TRACE = 5;
}

message ErrorInfo {
  int32 code = 1;
  Severity severity = 2;
  string title = 3;
  string description = 4;
  bytes memory_dump = 5;
}
