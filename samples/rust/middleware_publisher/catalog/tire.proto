syntax = "proto3";

package com.sdv.telemetry.sample;

import "google/protobuf/any.proto";
import "sdv/vsidl/v1/annotations.proto";

enum Location {
  FRONT_LEFT = 0;
  FRONT_RIGHT = 1;
  REAR_LEFT = 2;
  REAR_RIGHT = 3;
}

message TirePressure {
  option (.sdv.vsidl.v1.publication) = {
    instances_enum: "Location"
    message_count: 100
    model: SINGLE_PUB
  };

  uint32 pressure = 1;
}

message TireTemperature {
  option (.sdv.vsidl.v1.publication) = {
    instances_enum: "Location"
    message_count: 100
    model: SINGLE_PUB
  };

  uint32 temperature = 1;
}

message VehicleSpeed {
  option (.sdv.vsidl.v1.publication) = {
    model: SINGLE_PUB
    message_count: 100
  };

  float speed = 1;
}

message GetTireStatusRequest {
  Location tire = 1;
}

message GetTireStatusResponse {
  uint32 pressure = 2;
  uint32 temperature = 3;
}

service TireStatus {
  rpc CreateSubscription(GetTireStatusRequest) returns (stream GetTireStatusResponse) {}

  rpc GetLatestMessage(GetTireStatusRequest) returns (GetTireStatusResponse) {}
}
