syntax = "proto3";

message SpeedData {
  // The car's speed in km/h. Note that this is deliberately an `int32` so that
  // our sample publishers have a bit more variety, even though in reality, this
  // would probably be a float and measured in m/s.
  int32 speed = 1;

  // Indicates whether the car's current speed is above the road's speed limit.
  bool above_speed_limit = 2;
}
