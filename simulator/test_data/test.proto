syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "test_dep.proto";

enum TestEnum {
  ZERO = 0;
  ONE = 1;
  TWO = 2;
}

message TestMessage {
  int32 int32 = 1;
}

message TestMessageWithWellKnownType {
  .google.protobuf.Timestamp timestamp = 1;
}

message TestMessageWithDependencyInOtherFile {
  DepMessage dep_message = 1;
}
