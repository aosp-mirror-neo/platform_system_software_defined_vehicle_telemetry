syntax = "proto3";

package android.sdv.telemetry;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "system/software_defined_vehicle/telemetry/proto/expression.proto";

option java_multiple_files = true;

message MetricsConfig {
  // Required.
  // Universally unique configuration identifier.
  string uuid = 1;

  // Required.
  // Version number of the configuration. Must be more than 0.
  uint32 version = 2;

  // Optional.
  // Protobuf messages that are available in this Metrics Configuration.
  repeated google.protobuf.FileDescriptorProto descriptor_protos = 3;

  // Optional.
  // A script that is executed at the device side. Must contain all the handler
  // functions defined in subscribers below.
  // The script functions must be `pure` functions.
  string script = 4;

  // Optional.
  // Triggers that are available in the Metrics Configuration.
  repeated Trigger triggers = 5;

  // Optional.
  // Publishers that are available in the Metrics Configuration.
  repeated Publisher publishers = 6;

  // Optional.
  // Expression nodes that are available in the Metrics Configuration.
  repeated expr.Node expression_nodes = 7;

  // Optional.
  // Configurations of metrics reports that are to be generated.
  repeated MetricsReportConfig metrics_report_configs = 8;

  // Optional.
  // The name of the trigger that starts data collection. The state is not
  // persisted.
  string start_trigger_name = 9;

  // Optional.
  // The name of the trigger that ends data collection.
  string end_trigger_name = 10;

  // Optional.
  // The name of the trigger that finishes metrics configuration.
  // A finished metrics configuration is removed from the system.
  string finish_trigger_name = 11;
}

// Emits trigger events.
message Trigger {
  // Required.
  // The name of the trigger. Must be unique across all publishers and triggers
  // in the Metrics Configuration.
  string name = 1;

  oneof trigger_type {
    DataTrigger data_trigger = 2;
    PeriodicTrigger periodic_trigger = 3;
    ConditionalTrigger conditional_trigger = 4;
  }
}

// Listens to the publisher and triggers when it publishes a new message.
// The published message is stored in the activation context under publisher
// name and is available down the activation chain.
message DataTrigger {
  // Required.
  // The name of the publisher to listen to.
  string publisher_name = 1;
}

// Triggers periodically.
message PeriodicTrigger {
  // Required.
  // An interval between polls, in milliseconds.
  uint64 interval_ms = 1;
}

// Listens to other triggers, when they fire evaluates selector expression
// against the activation context and triggers if the returned value changes.
message ConditionalTrigger {
  // Required.
  // Underlying trigger names.
  repeated string trigger_names = 1;

  // Required.
  // The index of the root node of the expression that uses data from publishers
  // and returns a value. If `change_type` is not ALL, the value must be of
  // numeric type or a boolean. If a message from a publisher is not present in
  // the activation context, the context will be populated with the latest
  // published message.
  optional uint32 selector_node_index = 2;

  // Type of value change.
  enum ChangeType {
    CHANGE_TYPE_UNSPECIFIED = 0;
    RISING_EDGE = 1;
    FALLING_EDGE = 2;
    ALL = 3;
  }

  // Required.
  // The type of the value change that causes the trigger to fire.
  ChangeType change_type = 3;
}

// Publishes messages and stores the latest published message.
// A DataTrigger under publisher name that listens to it is implicitly created
// for each Publisher in the Metrics Configuration.
message Publisher {
  // Required.
  // The name of the publisher. Must be unique across all publishers and
  // triggers in the Metrics Configuration.
  string name = 1;

  oneof publisher_type {
    SignalPublisher signal_publisher = 2;
    ServicePublisher service_publisher = 3;
    AggregationPublisher aggregation_publisher = 4;
  }
}

// Publishes well-known data taxonomy signals exposed by the middleware layer.
message SignalPublisher {
  // Required.
  // Data taxonomy signal name.
  string signal_name = 1;
}

// Publishes messages from a customizable external service.
message ServicePublisher {
  // Optional.
  // Identification of the service in the service discovery.
  string service_name = 1;

  // Required.
  // Service-specific configuration.
  oneof option {
    NetworkPublisherConfig network_publisher_config = 10000;
    SamplePublisherConfig sample_publisher_config = 10001;
  }
}

// When triggered uses message builder to create a new message according
// to its underlying aggregated field assignments and publishes it.
message AggregationPublisher {
  // Required.
  // The names of the triggers that specify when a new message is published.
  repeated string trigger_names = 1;

  // Optional.
  // Specifies whether the aggregated value is reset when the publisher data is
  // read into activation context.
  bool reset_on_get = 2;

  // Required.
  // Message builder that defines how published message is created.
  ProtoMessageBuilder message_builder = 3;
}

// Specifies when and how data is combined into a Metrics Report to be reported
// to the OEM application.
message MetricsReportConfig {
  // Required.
  // The name of the metrics report config.
  string name = 1;

  // Optional.
  // The names of the triggers that specify when the metrics report is
  // generated.
  repeated string trigger_names = 2;

  // Optional.
  // Specifies whether to send the report using the latest published messages
  // on Telemetry Service shutdown or when the data collection is ended or
  // finished.
  bool report_incomplete = 3;

  // Required.
  // The message builder that creates a metrics report to the
  // OEM application. If a message from a publisher is not present in
  // the activation context, the context will be populated with the latest
  // published message.
  ProtoMessageBuilder message_builder = 4;
}

// Report message that is sent to the OEM application.
message MetricsReport {
  // Required.
  // Monotonously increasing report number in Metrics Configuration.
  // Starts from 1 and incremented by 1 for each new report.
  // Report numbers are reset after a power down (turn off) or process restart.
  uint32 report_number = 1;

  // Required.
  // Report generation timestamp.
  google.protobuf.Timestamp report_timestamp = 2;

  enum ReportReason {
    REPORT_TYPE_UNSPECIFIED = 0;
    // Report generated when related Metrics Report Config trigger fired.
    REGULAR = 1;
    // Report generated because the Telemetry Service was shutting down.
    INCOMPLETE_SHUTDOWN = 2;
    // Report generated because Metrics Configuration data collection ended.
    INCOMPLETE_END = 3;
    // Report generated because Metrics Configuration data collection
    // was finished.
    INCOMPLETE_FINISHED = 4;
  }

  // Required.
  // The reason the report was generated.
  ReportReason report_reason = 3;

  // Required.
  // UUID of Metrics Configuration that was used to generate the report.
  string metrics_config_uuid = 4;

  // Required.
  // The version of the Metrics Configuration that was used to generate the report.
  uint32 metrics_config_version = 5;

  // Required.
  // Metrics Report data.
  google.protobuf.Any report_data = 6;
}

message SamplePublisherConfig {}

enum TrafficDirection {
  ALL = 0;
  DOWNLOAD = 1;
  UPLOAD = 2;
}

message NetworkPublisherConfig {
  // Required.
  // The name of the application being monitored.
  string application_name = 1;

  // Required.
  // The direction of traffic to monitor.
  TrafficDirection traffic_direction = 2;
}

// Builds a protobuf message of some given type, where the content of the
// message is specified by the list of field assignments.
message ProtoMessageBuilder {
  // Required.
  // Type name of protobuf message that is created by the builder.
  // Must start with a dot.
  string message_type = 1;

  // Instruction on how to set a single field.
  message FieldAssignment {
    // Required.
    // The name of the protobuf message field to set.
    string field_name = 1;

    // Required.
    // Index of root expression node. The expression node's evaluation output
    // is either directly used as the value of the field, or aggregated
    // based on the aggregation type.
    uint32 expression_node_index = 2;

    // Every time the field value is built, the node output can be aggregated
    // with the past values of this field to produce a new field value.
    enum AggregationType {
      AGGREGATION_TYPE_UNSPECIFIED = 0;

      // No aggregation is performed. The expression node's latest
      // evaluation output will be used as the field value.
      NO_AGGREGATION = 1;

      // Concatenation of node evaluation outputs into a vector.
      VECTOR = 2;

      // Maximum numeric value of past and current node output value.
      // Requires the expression node to evaluate to a numeric value.
      MAX = 3;

      // Minimum numeric value of past and current node output value.
      // Requires the expression node to evaluate to a numeric value.
      MIN = 4;

      // Numeric average of all node output values.
      // Requires the expression node to evaluate to a numeric value.
      AVG = 5;

      // Count is incremented by 1 every time the message is built.
      COUNT = 6;
    }

    // Required.
    // Type of aggregation performed on the field.
    AggregationType aggregation_type = 3;
  }

  // Required.
  // Instructions on how to set the fields of the message.
  // Each field can have a different type of aggregation.
  repeated FieldAssignment field_assignments = 2;
}
