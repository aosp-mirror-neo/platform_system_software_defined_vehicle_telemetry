syntax = "proto3";

package google.sdv.telemetry;

import "google/protobuf/descriptor.proto";

message TelemetryPublisherMetadata {
  // Required.
  // Array of protobuf descriptors that contain root published message and all its
  // nested sub-messages.
  repeated google.protobuf.FileDescriptorProto descriptor_protos = 1;

  // Required.
  // The name of the type of the root published message.
  // The message must be declared in fileDescriptorProto.
  string message_type_name = 2;
}
