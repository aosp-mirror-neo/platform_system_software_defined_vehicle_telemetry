syntax = "proto3";

package android.sdv.telemetry.test;

enum TestEnum {
  NONE = 0;
  SOME = 1;
}

message TestMessage {
  // Singular fields
  int32 int_field = 1;
  float float_field = 2;
  string string_field = 3;
  TestEnum enum_field = 4;
  TestNestedMessage message_field = 5;

  // Repeated fields
  repeated bool repeated_bools = 6;
  repeated int64 repeated_i64s = 7;
  repeated double repeated_doubles = 8;
  repeated TestEnum repeated_enums = 9;
  repeated TestNestedMessage repeated_messages = 10;

  // Optional fields
  optional bool optional_bool_field = 11;
  optional int64 optional_int64_field = 12;
}

message TestNestedMessage {
  bool bool_field = 1;
  repeated int32 repeated_i32s = 2;
}
