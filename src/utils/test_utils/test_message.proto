syntax = "proto3";

package google.sdv.telemetry.test;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

enum TestEnum {
  NONE = 0;
  SOME = 1;
}

message TestMessage {
  // Singular fields
  bool bool_field = 1;
  int32 int_field = 2;
  float float_field = 3;
  string string_field = 4;
  TestEnum enum_field = 5;
  TestNestedMessage message_field = 6;
  google.protobuf.Any any_field = 7;
  bytes bytes_field = 8;

  // Repeated fields
  repeated bool repeated_bools = 9;
  repeated int64 repeated_i64s = 10;
  repeated double repeated_doubles = 11;
  repeated TestEnum repeated_enums = 12;
  repeated TestNestedMessage repeated_messages = 13;
  repeated google.protobuf.Empty repeated_empty = 14;

  // Optional fields
  optional bool optional_bool_field = 15;
  optional int64 optional_int64_field = 16;
}

message TestNestedMessage {
  bool bool_field = 1;
  repeated int32 repeated_i32s = 2;
}
