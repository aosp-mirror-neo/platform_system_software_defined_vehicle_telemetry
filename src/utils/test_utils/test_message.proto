syntax = "proto3";

package google.sdv.telemetry.test;

enum TestEnum {
  NONE = 0;
  SOME = 1;
}

message TestMessage {
  // Singular fields
  bool bool_field = 1;
  int32 int_field = 2;
  float float_field = 3;
  string string_field = 4;
  TestEnum enum_field = 5;
  TestNestedMessage message_field = 6;

  // Repeated fields
  repeated bool repeated_bools = 7;
  repeated int64 repeated_i64s = 8;
  repeated double repeated_doubles = 9;
  repeated TestEnum repeated_enums = 10;
  repeated TestNestedMessage repeated_messages = 11;

  // Optional fields
  optional bool optional_bool_field = 12;
  optional int64 optional_int64_field = 13;
}

message TestNestedMessage {
  bool bool_field = 1;
  repeated int32 repeated_i32s = 2;
}
